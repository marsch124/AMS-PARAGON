<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARAGON — three looks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E3E3E7; font-family: -apple-system, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; color: #1d1d1f; }
  body { padding: 36px 40px 40px; width: 4180px; height: 3900px; overflow: hidden; }
  h1 { font-size: 34px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 18px; color: #555; margin-bottom: 28px; }
  .looks { display: grid; grid-template-columns: 2030px 2030px; column-gap: 40px; row-gap: 36px; }
  .look { }
  .look > h2 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .look > .desc { font-size: 17px; color: #444; margin-bottom: 14px; }
  .shelf { display: grid; grid-template-columns: 1180px 393px 393px; column-gap: 24px; align-items: start; margin-bottom: 18px; }
  .cap { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; letter-spacing: .2px; }

  /* ---------- colours: the parts (his meanings), day and night ---------- */
  [data-theme="day"] {
    --green:#2A7A57; --pink:#BC3C78; --blue:#2A6DB3; --grey:#6E6E73; --gold:#8F6E10; --asp:#7E5210;
    --amber:#B0631A; --purple:#6B4EA8; --teal:#1E7F84; --orange:#B5580B; --morning:#D4640A; --evening:#6E3A86;
    --now:#477C9C; --red:#D93A3A; --onfill:#fff;
  }
  [data-theme="night"] {
    --green:#6CCB9B; --pink:#F285B6; --blue:#74B2EA; --grey:#9A9AA2; --gold:#E5BE55; --asp:#E0A83E;
    --amber:#EBA45A; --purple:#AC93E2; --teal:#62C5CA; --orange:#F2A45C; --morning:#FFA23A; --evening:#C79AE0;
    --now:#92C3DE; --red:#FF6B6B; --onfill:#1b1b1b;
  }

  /* ---------- Look A: Apple-plain ---------- */
  [data-look="a"][data-theme="day"]   { --canvas:#FFFFFF; --sidebar:#F3F3F5; --list:#FFFFFF; --surface:#FFFFFF; --line:#E5E5EA; --text:#1D1D1F; --text2:#6E6E73; --text3:#8E8E93; --ctl:#FFFFFF; --ctlb:#CFCFD4; --sel:#3478F6; --tint:0%; --phonebg:#F2F2F7; --card:#FFFFFF; --bar:#F8F8FA; --field:#EFEFF2; }
  [data-look="a"][data-theme="night"] { --canvas:#1E1E1E; --sidebar:#2A2A2D; --list:#1E1E1E; --surface:#262628; --line:#38383A; --text:#F5F5F7; --text2:#A1A1A6; --text3:#7C7C80; --ctl:#3A3A3D; --ctlb:#4C4C50; --sel:#2E68D1; --tint:0%; --phonebg:#000000; --card:#1C1C1E; --bar:#161618; --field:#2C2C2E; }
  /* ---------- Look B: coloured panels with meaning ---------- */
  [data-look="b"][data-theme="day"]   { --canvas:#F3F5F8; --sidebar:#EBEDF1; --list:#FFFFFF; --surface:#FFFFFF; --line:#E2E6EB; --text:#1C2430; --text2:#5C6470; --text3:#7A8290; --ctl:#FFFFFF; --ctlb:#D3D8DF; --sel:#3478F6; --tint:7%; --phonebg:#F3F5F8; --card:#FFFFFF; --bar:#F7F8FA; --field:#EDF0F4; }
  [data-look="b"][data-theme="night"] { --canvas:#15181C; --sidebar:#1B1F24; --list:#181B20; --surface:#1E2228; --line:#2E333A; --text:#ECEFF3; --text2:#A9B1BC; --text3:#7E8794; --ctl:#2A3039; --ctlb:#3B424C; --sel:#2E68D1; --tint:13%; --phonebg:#15181C; --card:#1E2228; --bar:#13161A; --field:#2A3039; }
  /* ---------- Look C: calm, Things-like, warm ---------- */
  [data-look="c"][data-theme="day"]   { --canvas:#FBFAF8; --sidebar:#F2F0EC; --list:#FBFAF8; --surface:#FBFAF8; --line:#E6E2DB; --text:#2B2A27; --text2:#76726B; --text3:#9A958D; --ctl:#FFFFFF; --ctlb:#D8D3CB; --sel:#3478F6; --tint:0%; --phonebg:#FBFAF8; --card:#FBFAF8; --bar:#F6F4F0; --field:#EFECE6; }
  [data-look="c"][data-theme="night"] { --canvas:#1C1B19; --sidebar:#26241F; --list:#1C1B19; --surface:#1C1B19; --line:#37342E; --text:#F0EDE7; --text2:#ABA69D; --text3:#7E7970; --ctl:#302D28; --ctlb:#46423B; --sel:#2E68D1; --tint:0%; --phonebg:#1C1B19; --card:#1C1B19; --bar:#171613; --field:#2B2925; }

  /* ---------- Mac window ---------- */
  .mac { width:1180px; height:760px; border-radius:11px; overflow:hidden; background:var(--canvas); color:var(--text); box-shadow:0 18px 50px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.18); display:flex; flex-direction:column; font-size:13px; position:relative; }
  .mac .toolbar { height:52px; display:grid; grid-template-columns:210px 300px 670px; border-bottom:1px solid var(--line); flex:none; }
  .mac .tb-side { background:var(--sidebar); display:flex; align-items:center; padding-left:13px; gap:8px; }
  .tl { display:flex; gap:8px; margin-right:14px; }
  .tl i { width:12px; height:12px; border-radius:50%; display:block; }
  .tl i:nth-child(1){background:#FF5F57;border:1px solid #E0443E;} .tl i:nth-child(2){background:#FEBC2E;border:1px solid #D89E24;} .tl i:nth-child(3){background:#28C840;border:1px solid #1FA532;}
  .tb-list { display:flex; align-items:center; padding:0 10px 0 14px; gap:8px; background:var(--list); border-left:1px solid var(--line); }
  .tb-list .ttl { font-size:15px; font-weight:600; }
  .tb-detail { display:flex; align-items:center; gap:4px; padding:0 12px 0 14px; border-left:1px solid var(--line); }
  .tbtn { width:30px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text2); }
  .tbtn.on { color:var(--green); background:color-mix(in srgb, var(--green) 18%, transparent); }
  .tbtn.dim { opacity:.4; }
  .tsep { width:1px; height:18px; background:var(--line); margin:0 6px; }
  .search { margin-left:auto; width:210px; height:26px; border-radius:7px; background:var(--field); border:1px solid var(--line); display:flex; align-items:center; gap:6px; padding:0 8px; color:var(--text3); font-size:13px; }
  .mac .cols { display:grid; grid-template-columns:210px 300px 670px; flex:1; min-height:0; }
  .sidebar { background:var(--sidebar); padding:8px 8px 10px; display:flex; flex-direction:column; }
  .sb-h { font-size:11px; font-weight:600; color:var(--text3); padding:10px 10px 3px; }
  .sb-r { display:flex; align-items:center; gap:8px; height:26px; padding:0 10px; border-radius:6px; font-size:13px; color:var(--text); }
  .sb-r .ico { width:16px; height:16px; flex:none; display:flex; }
  .sb-r .n { margin-left:auto; font-size:11px; color:var(--text3); }
  .sb-r.sel { background:rgba(127,127,140,.22); font-weight:500; }
  .sb-foot { margin-top:auto; font-size:11px; color:var(--text3); text-align:center; padding-top:8px; }
  .list { background:var(--list); border-left:1px solid var(--line); overflow:hidden; padding:6px 0; }
  .grp { padding:12px 16px 4px; display:flex; align-items:center; gap:7px; font-size:17px; font-weight:600; }
  .grp .n { margin-left:auto; font-size:12px; font-weight:400; color:var(--text3); }
  .grp.sm { font-size:12px; font-weight:500; padding-top:0; padding-bottom:6px; }
  [data-look="c"] .grp { margin:0 16px; padding-left:0; padding-right:0; }
  [data-look="c"] .grp.sm { border-bottom:1px solid color-mix(in srgb, var(--asp) 35%, transparent); padding-bottom:6px; margin-bottom:2px; }
  .row { display:flex; gap:10px; align-items:flex-start; padding:5px 10px 5px 16px; margin:0 8px; border-radius:6px; position:relative; }
  .row .mk { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
  .row .tx { flex:1; min-width:0; }
  .row .t { font-size:13px; line-height:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .s { font-size:11px; line-height:14px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .tr { font-size:11px; color:var(--text3); white-space:nowrap; margin-top:2px; }
  .row.sel { background:var(--sel); color:#fff; } .row.sel .s, .row.sel .tr { color:rgba(255,255,255,.85); }
  [data-look="a"] .row + .row::before, [data-look="c"] .row + .row::before { content:""; position:absolute; left:34px; right:10px; top:0; height:1px; background:var(--line); }
  [data-look="a"] .row.sel::before, [data-look="c"] .row.sel::before, .row.sel + .row::before { display:none; }
  .pill { display:inline-block; font-size:11px; font-weight:500; padding:1px 6px; border-radius:6px; line-height:14px; }
  .detail { overflow:hidden; display:flex; flex-direction:column; background:var(--canvas); }
  .scrollarea { flex:1; overflow:hidden; padding:14px 0 0; }
  .read { width:638px; margin:0 auto; }
  .title { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .title h1 { font-size:26px; font-weight:700; line-height:32px; color:var(--text); margin:0; letter-spacing:-.2px; }
  .tile { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:none; }
  .panel { --pc: var(--green); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  [data-look="b"] .panel { background:color-mix(in srgb, var(--pc) var(--tint), var(--surface)); }
  [data-look="b"][data-theme="night"] .panel { border:1px solid var(--line); }
  [data-look="a"] .panel, [data-look="c"] .panel { padding:4px 0 6px; margin-bottom:16px; }
  .ph { display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:600; color:var(--pc); margin-bottom:6px; }
  .ph .n { font-size:12px; font-weight:400; color:var(--text3); }
  .ph .chev { margin-left:auto; color:var(--pc); opacity:.8; }
  [data-look="c"] .ph { border-bottom:1px solid color-mix(in srgb, var(--pc) 35%, transparent); padding-bottom:5px; margin-bottom:4px; }
  .facts { display:grid; grid-template-columns:1fr 1fr; column-gap:18px; row-gap:7px; }
  .f { display:grid; grid-template-columns:70px 1fr; align-items:center; gap:8px; font-size:15px; min-height:24px; }
  .f .l { font-size:12px; color:var(--text3); }
  .pop { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 6px 0 9px; border-radius:6px; background:var(--ctl); border:1px solid var(--ctlb); box-shadow:0 1px 1px rgba(0,0,0,.05); font-size:13px; color:var(--text); max-width:100%; white-space:nowrap; }
  .pop .chev { color:var(--text3); margin-left:2px; }
  .pop .ico { display:flex; }
  .task { display:flex; align-items:flex-start; gap:10px; padding:5px 0; font-size:15px; line-height:20px; }
  .task .cb { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--pc); margin-top:2px; flex:none; display:flex; align-items:center; justify-content:center; }
  .task .cb.done { background:var(--pc); border-color:var(--pc); }
  .task.done { color:var(--text3); text-decoration:line-through; }
  .task .tr { margin-left:auto; font-size:12px; color:var(--text3); white-space:nowrap; display:flex; gap:6px; align-items:center; padding-top:3px; }
  .task .np { font-size:11px; font-weight:500; padding:1px 6px; border-radius:6px; background:color-mix(in srgb, var(--pc) 14%, transparent); color:var(--pc); }
  .task .tm { font-variant-numeric:tabular-nums; color:var(--pc); }
  .task .dash { border:1px dashed var(--text3); border-radius:6px; padding:0 6px; font-size:11px; }
  [data-look="a"] .task + .task, [data-look="c"] .task + .task { border-top:1px solid var(--line); }
  .ln { display:flex; align-items:center; gap:8px; font-size:15px; padding:5px 0; }
  .ln .k { font-size:12px; color:var(--text3); margin-left:auto; }
  [data-look="a"] .ln + .ln, [data-look="c"] .ln + .ln { border-top:1px solid var(--line); }
  .fold { font-size:12px; color:var(--text3); display:flex; align-items:center; gap:6px; margin:2px 0 10px; }
  .md { font-size:15px; line-height:22px; color:var(--text); }
  .md h2 { font-size:22px; font-weight:600; line-height:28px; margin:6px 0 6px; }
  .md h3 { font-size:18px; font-weight:600; line-height:24px; margin:14px 0 4px; }
  .md p { margin-bottom:8px; }
  .md ul { padding-left:20px; margin-bottom:8px; }
  .md li { margin-bottom:2px; }
  .md a { color:var(--pc); text-decoration:none; }
  .md .tag { color:var(--pc); }
  .md blockquote { border-left:2px solid var(--pc); padding-left:10px; color:var(--text2); font-style:italic; }
  .md code { font-family:"SF Mono", Menlo, monospace; font-size:14px; background:color-mix(in srgb, var(--text) 5%, transparent); padding:0 4px; border-radius:4px; }
  .md .m { color:var(--text3); opacity:.55; font-weight:400; }
  .addbar { height:44px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--bar); flex:none; }
  .addbar .fld { flex:1; height:28px; border-radius:7px; background:var(--ctl); border:1px solid var(--ctlb); display:flex; align-items:center; padding:0 10px; color:var(--text3); font-size:13px; }
  .addbar .ib { color:var(--text2); display:flex; }
  .addbar .go { width:28px; height:28px; border-radius:50%; background:var(--green); color:var(--onfill); display:flex; align-items:center; justify-content:center; }
  .kfocus { outline:3px solid color-mix(in srgb, var(--sel) 45%, transparent); outline-offset:1px; }
  svg { display:block; }

  /* ---------- iPhone ---------- */
  .phone { width:393px; height:852px; border-radius:54px; background:var(--phonebg); color:var(--text); overflow:hidden; position:relative; box-shadow:0 0 0 10px #111, 0 0 0 12px #3a3a3a, 0 16px 40px rgba(0,0,0,.35); font-size:17px; }
  .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; border-radius:20px; background:#000; }
  .status { height:54px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 32px 8px 36px; font-size:16px; font-weight:600; }
  .status .r { display:flex; gap:6px; align-items:center; }
  .nav { height:44px; display:flex; align-items:center; padding:0 14px; gap:8px; position:relative; }
  .nav .rb { width:40px; height:40px; border-radius:50%; background:var(--card); box-shadow:0 1px 4px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; }
  [data-theme="night"] .nav .rb { background:#2C2C2E; box-shadow:0 1px 4px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.12); }
  .nav .ctr { position:absolute; left:60px; right:60px; text-align:center; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav .sp { flex:1; }
  .ltitle { font-size:34px; font-weight:700; letter-spacing:.2px; padding:4px 4px 10px; line-height:41px; }
  .pbody { position:absolute; top:0; bottom:0; left:0; right:0; overflow:hidden; }
  .pscroll { position:absolute; left:0; right:0; top:98px; bottom:92px; overflow:hidden; padding:0 16px; }
  .pscroll.note { bottom:156px; padding-top:6px; }
  .psec { font-size:17px; font-weight:600; display:flex; align-items:center; gap:7px; padding:14px 4px 6px; }
  .psec .n { margin-left:auto; font-size:13px; font-weight:400; color:var(--text3); }
  .psec.sm { font-size:13px; font-weight:500; padding-top:0; padding-bottom:6px; }
  [data-look="c"] .psec { margin:0 4px; padding-left:0; padding-right:0; }
  [data-look="c"] .psec.sm { border-bottom:1px solid color-mix(in srgb, var(--asp) 35%, transparent); padding-bottom:6px; margin-bottom:2px; }
  .pcard { background:var(--card); border-radius:12px; overflow:hidden; }
  [data-look="c"] .pcard { background:transparent; border-radius:0; }
  [data-look="b"] .pcard { box-shadow:0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); }
  .prow { display:flex; gap:10px; align-items:flex-start; padding:9px 12px 9px 16px; position:relative; }
  .prow + .prow::before { content:""; position:absolute; left:34px; right:0; top:0; height:1px; background:var(--line); }
  [data-look="c"] .prow + .prow::before { left:34px; right:0; }
  .prow .mk { width:8px; height:8px; border-radius:50%; margin-top:7px; flex:none; }
  .prow .tx { flex:1; min-width:0; }
  .prow .t { font-size:17px; line-height:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .s { font-size:13px; line-height:18px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .tr { font-size:13px; color:var(--text3); display:flex; align-items:center; gap:4px; padding-top:3px; white-space:nowrap; }
  .ppanel { --pc:var(--green); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:var(--card); }
  [data-look="b"] .ppanel { background:color-mix(in srgb, var(--pc) var(--tint), var(--card)); }
  [data-look="b"][data-theme="night"] .ppanel { border:1px solid var(--line); }
  [data-look="c"] .ppanel { background:transparent; padding:4px 4px 6px; border-radius:0; }
  .pph { display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:600; color:var(--pc); margin-bottom:4px; }
  .pph .n { font-size:13px; font-weight:400; color:var(--text3); }
  [data-look="c"] .pph { border-bottom:1px solid color-mix(in srgb, var(--pc) 35%, transparent); padding-bottom:5px; }
  .pf { display:grid; grid-template-columns:78px 1fr; align-items:center; gap:8px; font-size:17px; min-height:30px; }
  .pf .l { font-size:13px; color:var(--text3); }
  .pf > span:last-child { min-width:0; }
  .ppop { display:flex; align-items:center; gap:6px; font-size:17px; color:var(--text); max-width:100%; white-space:nowrap; overflow:hidden; }
  .ppop > span:not(.chev), .ppop > svg { flex:none; }
  .ppop .tx { display:block; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ppop .chev { color:var(--text3); }
  .ptask { display:flex; gap:12px; align-items:flex-start; padding:7px 0; font-size:17px; line-height:22px; }
  .ptask .cb { width:22px; height:22px; border-radius:50%; border:1.6px solid var(--pc); flex:none; display:flex; align-items:center; justify-content:center; }
  .ptask .cb.done { background:var(--pc); }
  .ptask.done { color:var(--text3); text-decoration:line-through; }
  .ptask .tr { margin-left:auto; font-size:13px; color:var(--text3); white-space:nowrap; padding-top:3px; display:flex; gap:6px; align-items:center; }
  .ptask .np { font-size:12px; font-weight:500; padding:1px 7px; border-radius:7px; background:color-mix(in srgb, var(--pc) 14%, transparent); color:var(--pc); }
  .ptask .dash { border:1px dashed var(--text3); border-radius:7px; padding:0 7px; font-size:12px; }
  [data-look="a"] .ptask + .ptask, [data-look="c"] .ptask + .ptask { border-top:1px solid var(--line); }
  .pln { display:flex; align-items:center; gap:10px; font-size:17px; padding:7px 0; }
  [data-look="a"] .pln + .pln, [data-look="c"] .pln + .pln { border-top:1px solid var(--line); }
  .pmd { font-size:17px; line-height:24px; padding:0 4px; }
  .pmd h2 { font-size:22px; font-weight:600; line-height:28px; margin:4px 0 6px; }
  .pmd h3 { font-size:20px; font-weight:600; line-height:26px; margin:12px 0 4px; }
  .pmd p { margin-bottom:8px; }
  .pmd ul { padding-left:22px; }
  .pmd a { color:var(--pc); text-decoration:none; }
  .pmd .m { color:var(--text3); opacity:.55; font-weight:400; }
  .pfold { font-size:13px; color:var(--text3); display:flex; align-items:center; gap:6px; margin:0 4px 10px; }
  .paddbar { position:absolute; left:0; right:0; bottom:104px; height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; background:var(--bar); border-top:1px solid var(--line); }
  .paddbar .fld { flex:1; height:36px; border-radius:10px; background:var(--field); display:flex; align-items:center; padding:0 12px; color:var(--text3); font-size:17px; }
  .paddbar .go { width:34px; height:34px; border-radius:50%; background:var(--green); color:var(--onfill); display:flex; align-items:center; justify-content:center; }
  .tabbar { position:absolute; left:20px; right:20px; bottom:26px; height:64px; border-radius:32px; background:var(--card); box-shadow:0 2px 14px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:space-around; padding:0 8px; }
  [data-theme="night"] .tabbar { background:rgba(40,40,44,.92); box-shadow:0 2px 14px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.12); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:500; color:var(--text2); width:62px; position:relative; }
  .tab.on { color:var(--text); }
  .tab .bd { position:absolute; top:-5px; right:8px; min-width:18px; height:18px; border-radius:9px; background:#FF3B30; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 5px; }

    <div><small>iPhone</small><span style="font-size:14px;color:#555">Apple’s text styles: large title · headline · body · footnote, growing with Dynamic Type</span></div>
  </div>
  <div><div style="font-size:14px;color:#555;margin-bottom:8px">His colours, kept — one per part, used the same way everywhere (sidebar icon · heading · button · mark · panel tint). Day on the left half of each dot, night on the right.</div>
  <div class="chips">${parts.map(([n,c])=>`<span class="chip"><i style="background:linear-gradient(90deg, var(--${c}-d) 50%, var(--${c}-n) 50%)"></i>${n}</span>`).join('')}</div>
  <div style="font-size:13px;color:#777;margin-top:12px">Pop-ups: white with a border and a grey chevron. Main button: always full colour. Keyboard focus: the blue ring (see Add a task). Icons: single-stroke, hand-drawn, in the part colour.</div></div></div>`;
// day/night values for the legend dots
const dn = {green:['#2A7A57','#6CCB9B'],pink:['#BC3C78','#F285B6'],blue:['#2A6DB3','#74B2EA'],grey:['#6E6E73','#9A9AA2'],gold:['#8F6E10','#E5BE55'],asp:['#7E5210','#E0A83E'],amber:['#B0631A','#EBA45A'],purple:['#6B4EA8','#AC93E2'],teal:['#1E7F84','#62C5CA'],orange:['#B5580B','#F2A45C'],morning:['#D4640A','#FFA23A'],evening:['#6E3A86','#C79AE0'],now:['#477C9C','#92C3DE']};
for (const k in dn){ document.documentElement.style.setProperty(`--${k}-d`, dn[k][0]); document.documentElement.style.setProperty(`--${k}-n`, dn[k][1]); }
</script>
</body>
