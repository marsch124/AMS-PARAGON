name: TestFlight

# Builds PARAGON for the iPhone and for the Mac and sends both to TestFlight, so a new
# version appears on both devices without touching Xcode. Started by hand from the Actions tab.
#
# Needs four repository secrets, made once in App Store Connect:
#   ASC_KEY_ID     the key's ID, ten characters
#   ASC_ISSUER_ID  the issuer ID shown above the key list
#   ASC_KEY_P8     the whole contents of the AuthKey_XXXXXXXXXX.p8 file
#   ASC_TEAM_ID    the ten-character Team ID from App Store Connect > Membership
# The key must have the Admin role: App Manager cannot create signing certificates.
# The archive is signed ad-hoc ("-") and the export signs it for the App Store. Signing it
# properly at archive time signs it for development, and every runner being a fresh machine
# asked Apple for a new development certificate on every run until the account hit its limit
# (build 61). Ad-hoc asks Apple for nothing and still writes the entitlements into the app,
# which is the part an unsigned build skips (build 206).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What is new in this build
        required: false
        default: ""

jobs:
  upload:
    name: Send ${{ matrix.label }} to TestFlight
    runs-on: macos-26
    strategy:
      # One failing platform must not stop the other from reaching TestFlight.
      fail-fast: false
      matrix:
        include:
          - label: the iPhone app
            destination: generic/platform=iOS
            archive: Paragon-iOS
            # Ad-hoc ("-"), the same as the Mac, and build 206 is about why. Until then this
            # was CODE_SIGNING_ALLOWED=NO — completely unsigned — on the belief that the App
            # Store profile would supply the entitlements at export. It does not. A build with
            # signing switched off never runs the step that writes the entitlements into the
            # app, so there was nothing for the export to carry over, and the App Group was
            # missing from every iPhone build from 42 to 205. The comment under the Mac's line
            # had said exactly this since build 64 and was never applied here.
            # Ad-hoc asks Apple for nothing, so it cannot mint the development certificates
            # that build 61 ran out of; the export still does the real signing.
            signing: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER=
          - label: the Mac app
            destination: generic/platform=macOS
            archive: Paragon-macOS
            # Ad-hoc ("-") costs no certificate but does embed the entitlements, which a
            # Mac App Store upload insists on: without them Apple answers "App sandbox not
            # enabled". The export replaces the placeholder with the real signature.
            signing: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER=
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          # Apple refuses uploads built with an older SDK, so always take the
          # highest Xcode the image has.
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Check the secrets are there
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM_ID" ] && missing="$missing ASC_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings › Secrets and variables › Actions."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Number this build
        run: |
          # Use the app's own build number, the one shown in the sidebar and in
          # Help, so TestFlight and the app never disagree. A second upload of the
          # same build number is refused by Apple, so the run number is appended.
          STAMP=$(sed -n 's/.*static let number = \([0-9][0-9]*\).*/\1/p' App/Paragon/AppModel.swift | head -1)
          if [ -z "$STAMP" ]; then
            echo "Could not read BuildStamp.number from App/Paragon/AppModel.swift"
            exit 1
          fi
          echo "App build number: $STAMP"
          BUILD="$STAMP.${{ github.run_number }}"
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          # Every bundle in the app must carry the same version, or Apple refuses the upload
          # with "bundle version does not match". The widget (build 174) is one of them.
          for plist in App/Config/Paragon/Info.plist App/Config/ParagonShare/Info.plist App/Config/ParagonWidgets/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$STAMP" "$plist"
          done
          # Says the app uses no encryption beyond what Apple exempts, so TestFlight
          # does not ask the same question on every upload.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Config/Paragon/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Config/Paragon/Info.plist

      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$KEY" > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      - name: Archive the app
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          # The real signing happens at export, with the distribution identity, which is
          # cloud managed and reused. Signing properly here would sign for development
          # instead, and every fresh runner then asked Apple for a new development
          # certificate until the account hit its limit (build 61). How little signing each
          # platform can get away with is in the matrix above.
          xcodebuild archive \
            -project Paragon.xcodeproj \
            -scheme Paragon \
            -destination '${{ matrix.destination }}' \
            -archivePath "$PWD/build/${{ matrix.archive }}.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ${{ matrix.signing }} \
            2>&1 | tee build/archive.log | grep -E "error:|warning:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      - name: What is inside the app
        # Build 177. His widget came up blank on the phone and nothing in the logs could say
        # whether the widget was even in the app: both the archive and the export steps keep
        # only the lines matching "error:", so an extension quietly left out would look exactly
        # like a clean build. This step is three seconds and it names every bundle that shipped.
        run: |
          APP=$(ls -d "$PWD/build/${{ matrix.archive }}.xcarchive"/Products/Applications/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "No app in the archive."
            exit 0
          fi
          echo "App: $(basename "$APP")"
          # Build 206: the app's own entitlements, read straight out of the archive. The App
          # Group was missing from every iPhone build for 163 builds and this step looked at
          # the extensions only, so the one bundle that mattered most was never asked.
          echo "--- entitlements of the app itself ---"
          codesign -d --entitlements :- "$APP" 2>&1 | head -40 || true
          if codesign -d --entitlements :- "$APP" 2>/dev/null | grep -qi "application-groups"; then
            echo "APP GROUP IS IN THE ARCHIVED APP"
          else
            echo "NO APP GROUP IN THE ARCHIVED APP"
          fi
          # An iPhone app is flat and keeps its extensions in PlugIns; a Mac app keeps them in
          # Contents/PlugIns. Looking in one place only made the Mac app of build 178 report
          # "no extensions" when the question had not really been asked.
          PLUGINS="$APP/PlugIns"
          [ -d "$PLUGINS" ] || PLUGINS="$APP/Contents/PlugIns"
          if [ -d "$PLUGINS" ]; then
            echo "Extensions in $(echo "$PLUGINS" | sed "s|.*$(basename "$APP")/||"):"
            ls -1 "$PLUGINS"
          else
            echo "No PlugIns folder: no extensions are embedded in this app."
          fi
          for ext in "$PLUGINS"/*.appex; do
            [ -e "$ext" ] || continue
            echo "--- $(basename "$ext") ---"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$ext/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ext/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$ext/Info.plist" || true
            codesign -d --entitlements :- "$ext" 2>&1 | head -20 || true
          done

      - name: Send it to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/${{ matrix.archive }}.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee build/export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build/export.log

      - name: What the App Store actually signed
        # iPhone only, and only because there is no other way to see it: the upload export
        # writes nothing to disk. So this exports a second copy to a file and reads the
        # entitlements out of the App-Store-signed app and its extensions. The step above
        # reads the archive; this one reads what Apple actually put its name to, and the two
        # together say whether an entitlement was never written or was written and dropped.
        #
        # The question it answers: **is the App Group really in the signed app?** Apple's
        # automatic signing silently drops an entitlement the App ID does not carry, and a
        # dropped App Group is invisible everywhere except on his phone, where the widget then
        # has nothing to read and the share extension quietly writes to a folder nobody reads.
        if: matrix.archive == 'Paragon-iOS'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          cp build/ExportOptions.plist build/ExportOptionsCheck.plist
          /usr/libexec/PlistBuddy -c "Set :destination export" build/ExportOptionsCheck.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/${{ matrix.archive }}.xcarchive" \
            -exportPath "$PWD/build/export-check" \
            -exportOptionsPlist build/ExportOptionsCheck.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee build/export-check.log | grep -E "error:|EXPORT" || true
          IPA=$(ls build/export-check/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "No ipa was written; nothing to read."
            exit 0
          fi
          rm -rf build/ipa && mkdir -p build/ipa
          unzip -q "$IPA" -d build/ipa
          for bundle in build/ipa/Payload/*.app build/ipa/Payload/*.app/PlugIns/*.appex; do
            [ -e "$bundle" ] || continue
            echo "=== $(basename "$bundle") ==="
            codesign -d --entitlements :- "$bundle" 2>&1 | grep -A3 -i "application-groups" || echo "NO APP GROUP IN THIS BUNDLE"
          done

      - name: Say what happened
        if: success()
        run: |
          echo "### Sent ${{ matrix.label }} to TestFlight" >> $GITHUB_STEP_SUMMARY
          echo "PARAGON build $STAMP — the same number the app shows in the sidebar." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Apple processes it for a few minutes, then it appears in TestFlight." >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "What is new: ${{ github.event.inputs.notes }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Keep the logs when something fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ matrix.archive }}
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"
