name: CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  app-build:
    name: App build (macOS + iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme Paragon -destination 'platform=macOS' \
            -derivedDataPath build/dd-macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-macos.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-macos.log

      - name: What is inside the Mac app
        # The widget is a separate bundle inside the app. A build that compiles it but never
        # copies it in looks exactly like a clean build, which is how the Mac widget could ship
        # as nothing at all. Cheaper to ask here than to spend a TestFlight upload finding out.
        run: |
          APP=$(ls -d build/dd-macos/Build/Products/*/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "No app was built."
            exit 0
          fi
          echo "App: $APP"
          if [ -d "$APP/Contents/PlugIns" ]; then
            ls -1 "$APP/Contents/PlugIns"
          else
            echo "No Contents/PlugIns folder: no extensions are embedded in the Mac app."
          fi
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme Paragon -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-ios.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-ios.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build-*.log

  screen-tests:
    name: Screen tests (iPhone Simulator)
    runs-on: macos-15
    # A stuck simulator would otherwise hold the job for GitHub's six-hour default. The
    # slowest honest run so far took fourteen minutes (build 194, a slow runner, every test
    # two to seven times its usual time); thirty leaves room for that and stops a hang.
    timeout-minutes: 30
    # A job of its own, so a red light says "a screen is broken" and not "the app does not
    # compile". Build 190: until now CI compiled this app and never opened a screen in it,
    # which is why builds 71-74, 85 and 114-128 all shipped green.
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        # By id, not by name: the runner image decides which iPhones exist, and a destination
        # naming a device that is not on this image fails with something that reads like a
        # broken test.
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator on this runner."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Press the buttons
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme ParagonUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-uitests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee test-ui.log | grep -E "error:|Test Case|Test Suite|XCTAssert|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test-ui.log
      - name: Check the tests really ran
        # **A suite with nothing in it also says TEST SUCCEEDED.** Build 178 paid for a check
        # that could only be wrong in one direction, and this is the same shape: if the target
        # ever stops finding its tests, the step above would go green and say nothing.
        run: |
          STARTED=$(grep -c "' started\.$" test-ui.log || true)
          PASSED=$(grep -c "' passed (" test-ui.log || true)
          SKIPPED=$(grep -c "' skipped (" test-ui.log || true)
          echo "$PASSED of $STARTED test cases passed, $SKIPPED skipped."
          if [ "$STARTED" -lt 1 ]; then
            echo "No test case ran at all."
            exit 1
          fi
          if [ "$STARTED" != "$((PASSED + SKIPPED))" ]; then
            echo "A test case started and did not finish."
            exit 1
          fi
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-test-log
          path: test-ui.log

  screen-tests-ipad:
    name: Screen tests (iPad mini)
    runs-on: macos-15
    # The iPad draws the Mac's three columns, not the phone's tabs, so it is a third layout and
    # neither suite above sees it (2 November 2026). Only `IPadScreens` runs here: it presses
    # every sidebar row upright and on its side and keeps a picture of each screen, uploaded as
    # the `ipad-mini-screens` artifact.
    timeout-minutes: 30
    # To put the pictures on the ipad-screens branch (the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPad mini
        id: sim
        # By id, as for the iPhone. If this runner image has no iPad mini made, one is made from
        # the newest iPad mini model and the newest iOS it has.
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPad mini" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            TYPE=$(xcrun simctl list devicetypes | grep -E "^iPad mini" | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
            RUNTIME=$(xcrun simctl list runtimes available | grep -E "^iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
            echo "No iPad mini on this runner; making one: $TYPE on $RUNTIME"
            if [ -n "$TYPE" ] && [ -n "$RUNTIME" ]; then
              UDID=$(xcrun simctl create "iPad mini (CI)" "$TYPE" "$RUNTIME" || true)
            fi
          fi
          if [ -z "$UDID" ]; then
            echo "No iPad mini simulator on this runner, and none could be made."
            exit 1
          fi
          echo "Using: $(xcrun simctl list devices | grep "$UDID")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Press the buttons
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme ParagonUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-uitests-ipad \
            -resultBundlePath build/ipad.xcresult \
            -only-testing:ParagonUITests/IPadScreens \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee test-ui-ipad.log | grep -E "error:|Test Case|Test Suite|XCTAssert|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test-ui-ipad.log
      - name: Check the tests really ran
        # As for the iPhone, and stricter: a skip here means the tests did not think they were
        # on an iPad, which would make every picture a lie.
        run: |
          STARTED=$(grep -c "' started\.$" test-ui-ipad.log || true)
          PASSED=$(grep -c "' passed (" test-ui-ipad.log || true)
          echo "$PASSED of $STARTED test cases passed."
          if [ "$STARTED" -lt 1 ]; then
            echo "No test case ran at all."
            exit 1
          fi
          if [ "$STARTED" != "$PASSED" ]; then
            echo "A test case did not pass (skipped, or started and did not finish)."
            exit 1
          fi
      - name: Collect the pictures
        if: always()
        # The tests write the pictures to build/ipad-screens themselves. If none arrived there,
        # they are taken out of the result bundle, where every picture is also kept.
        run: |
          mkdir -p build/ipad-screens
          COUNT=$(find build/ipad-screens -name "*.png" | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ] && [ -d build/ipad.xcresult ]; then
            echo "No pictures written by the tests; taking them out of the result bundle."
            xcrun xcresulttool export attachments --path build/ipad.xcresult --output-path build/ipad-screens || true
            COUNT=$(find build/ipad-screens -type f ! -name "*.json" | wc -l | tr -d ' ')
          fi
          echo "$COUNT pictures."
          ls -1 build/ipad-screens
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-mini-screens
          path: build/ipad-screens
          if-no-files-found: warn
      - name: Put the pictures on the ipad-screens branch
        if: always()
        # GitHub shows them in the browser, one under the other, with nothing to download:
        # https://github.com/marsch124/AMS-PARAGON/tree/ipad-screens
        # The branch holds only the pictures and a page listing them, as one commit that each
        # run replaces, so it never grows. It is never merged anywhere.
        run: |
          COUNT=$(find build/ipad-screens -maxdepth 1 -name "*.png" | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "No pictures to put on the branch."
            exit 0
          fi
          SHA=$(git rev-parse --short HEAD)
          OUT="$RUNNER_TEMP/ipad-screens"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp build/ipad-screens/*.png "$OUT/"
          cd "$OUT"
          {
            echo "# PARAGON on an iPad mini"
            echo
            echo "Pictures from CI run ${{ github.run_number }}, commit $SHA, $(date -u '+%d %B %Y %H:%M') UTC."
            echo "Upright (portrait) first, then on its side (landscape)."
            echo
            for f in portrait*.png landscape*.png; do
              [ -e "$f" ] || continue
              echo "## ${f%.png}"
              echo
              echo "![${f%.png}](${f// /%20})"
              echo
            done
          } > README.md
          git init -q -b ipad-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iPad mini pictures from CI run ${{ github.run_number }} ($SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipad-screens
          echo "$COUNT pictures on https://github.com/${{ github.repository }}/tree/ipad-screens"
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-test-log-ipad
          path: test-ui-ipad.log

  screen-tests-mac:
    name: Screen tests (Mac)
    runs-on: macos-15
    # The runner is a Mac, so no simulator: the app itself is started and clicked. Build 195.
    # The faults that cost this project the most were the Mac's — the Inbox list of builds
    # 71-74 and the Map canvas of build 85 — and the phone suite cannot see either.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Press the buttons
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme ParagonUITests \
            -destination "platform=macOS" \
            -derivedDataPath build/dd-uitests-mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee test-ui-mac.log | grep -E "error:|Test Case|Test Suite|XCTAssert|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test-ui-mac.log
      - name: Check the tests really ran
        run: |
          STARTED=$(grep -c "' started\.$" test-ui-mac.log || true)
          PASSED=$(grep -c "' passed (" test-ui-mac.log || true)
          SKIPPED=$(grep -c "' skipped (" test-ui-mac.log || true)
          echo "$PASSED of $STARTED test cases passed, $SKIPPED skipped."
          if [ "$STARTED" -lt 1 ]; then
            echo "No test case ran at all."
            exit 1
          fi
          if [ "$STARTED" != "$((PASSED + SKIPPED))" ]; then
            echo "A test case started and did not finish."
            exit 1
          fi
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-test-log-mac
          path: test-ui-mac.log

  commit-project:
    name: Commit generated Xcode project
    runs-on: macos-15
    needs: [core-tests, app-build, screen-tests, screen-tests-ipad, screen-tests-mac]
    # Only when the project definition itself changed, so a developer's local
    # signing settings in Paragon.xcodeproj are never overwritten by a pull.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip unless project.yml changed
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx "project.yml"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "project.yml unchanged; leaving the committed Xcode project alone."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        if: steps.check.outputs.run == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.check.outputs.run == 'true'
        run: xcodegen generate
      - name: Commit and push when it changed
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Paragon.xcodeproj App/Config
          if git diff --cached --quiet; then
            echo "Xcode project is up to date."
            exit 0
          fi
          git commit -m "Regenerate Xcode project, Info.plists and entitlements from project.yml"
          git push
