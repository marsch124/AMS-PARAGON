<title>PARAGON Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* PARAGON Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on PARAGON 1.0 (336). Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F7F5FA; --panel: #FFFFFF; --fg: #231C33; --muted: #6D6580; --line: #E3DDEE;
  --accent: #6B4EA8; --accent-soft: #EEE9F8; --good: #2F7D32; --good-soft: #E6F3E6; --warn: #A8431A;
  --shadow: 0 18px 40px rgba(35,28,51,.2);
  --c-today:#6B4EA8; --c-inbox:#5E7D12; --c-proj:#2E7D5B; --c-area:#C2417C; --c-res:#2C6FB5; --c-arch:#6E6E73; --c-goal:#8F6E10; --c-asp:#8A5A12;
  --c-rev:#1E7F84; --c-block:#C05E0C; --c-start:#D4640A; --c-close:#6E3A86; --c-now:#4B7F9E; --c-set:#6B4EA8; --c-red:#D93025; --c-green:#2FA35A;
  --pbg:#F2F2F7; --pcard:#FFFFFF; --pink:#1C1C1E; --pmuted:#6C6C70; --pline:#E0E0E5; --pglass:rgba(255,255,255,.88); --pfield:rgba(120,120,128,.14);
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#16131C; --panel:#211C2B; --fg:#F1EDF8; --muted:#B2A9C4; --line:#3A3249;
  --accent:#B7A0EE; --accent-soft:#2B2342; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-today:#A98FE0; --c-inbox:#B4D25A; --c-proj:#5FBF92; --c-area:#F07FB2; --c-res:#6FAEE8; --c-arch:#9A9AA2; --c-goal:#E5BE55; --c-asp:#E0A83E;
  --c-rev:#5FC2C7; --c-block:#F2A45C; --c-start:#FFA23A; --c-close:#C79AE0; --c-now:#8FC0DC; --c-set:#A98FE0; --c-red:#FF6B60; --c-green:#5FD08A;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.88); --pfield:rgba(120,120,128,.3);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#16131C; --panel:#211C2B; --fg:#F1EDF8; --muted:#B2A9C4; --line:#3A3249;
  --accent:#B7A0EE; --accent-soft:#2B2342; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-today:#A98FE0; --c-inbox:#B4D25A; --c-proj:#5FBF92; --c-area:#F07FB2; --c-res:#6FAEE8; --c-arch:#9A9AA2; --c-goal:#E5BE55; --c-asp:#E0A83E;
  --c-rev:#5FC2C7; --c-block:#F2A45C; --c-start:#FFA23A; --c-close:#C79AE0; --c-now:#8FC0DC; --c-set:#A98FE0; --c-red:#FF6B60; --c-green:#5FD08A;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.88); --pfield:rgba(120,120,128,.3);
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #6B4EA8; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #6B4EA8; border-color: #6B4EA8; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage) button { font: inherit; color: inherit }
:where(.stage) input, :where(.stage) textarea { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 14px 96px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.nav { display: flex; align-items: center; gap: 8px; min-height: 44px }
.nav h1 { margin: 0; font-size: 31px; line-height: 1.1; font-weight: 700; flex: 1; min-width: 0 }
.back { display: flex; align-items: center; border: 0; background: none; font-size: 16px; font-weight: 500; cursor: pointer; padding: 4px 0; color: var(--c-set) }
.back svg { width: 20px; height: 20px }
.sub { color: var(--pmuted); font-size: 13px }
.sync { border: 0; background: none; display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--pmuted); cursor: pointer; padding: 2px 4px; line-height: 1.1 }
.sync svg { width: 28px; height: 28px; fill: none; stroke-width: 2.4; stroke-linecap: round }
.sync .trk { stroke: var(--pline) }
.band { border-radius: 12px; color: #fff; padding: 8px 12px; margin: 2px 0 8px; display: flex; align-items: center; gap: 8px; min-height: 40px }
.band .bt { font-size: 13px; font-weight: 600; flex: 1; min-width: 0 }
.bbtns { display: flex; gap: 5px }
.bb { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; color: #fff; font-size: 9.5px; font-weight: 500; padding: 0 }
.bb i { width: 34px; height: 24px; border-radius: 12px; background: #fff; display: grid; place-items: center }
.bb i svg { width: 17px; height: 17px }
.bb.strong { font-weight: 700 }
.sec2 { display: flex; align-items: center; gap: 8px; margin: 12px 2px 4px; font-weight: 700; font-size: 16px }
.sec2 .cap { font-size: 11.5px; font-weight: 600; border-radius: 9px; padding: 0 7px; background: color-mix(in srgb, currentColor 16%, transparent) }
.sec2 .hb2 { border: 0; background: none; padding: 2px; display: grid; cursor: pointer; color: inherit }
.sec2 .hb2 svg { width: 20px; height: 20px }
.sec2 .sp { flex: 1 }
.card { background: var(--pcard); border-radius: 12px; border: 1px solid var(--pline) }
.pc { background: color-mix(in srgb, var(--tint, #888) 9%, var(--pcard)); border: 1px solid color-mix(in srgb, var(--tint, #888) 28%, var(--pline)); border-radius: 12px; margin-bottom: 6px }
.trow2 { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; min-height: 44px; cursor: default }
.trow2 .tx { flex: 1; min-width: 0 }
.trow2 .tn { overflow-wrap: anywhere }
.trow2 .tn.dn { color: var(--pmuted); text-decoration: line-through }
.trow2 .ts { font-size: 12px; color: var(--pmuted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.trow2 .ts .late { color: var(--c-red) }
.trow2 .ts svg { width: 12px; height: 12px; vertical-align: -2px }
.tkc { width: 24px; height: 24px; border-radius: 50%; border: 1.8px solid var(--tint, var(--pmuted)); background: none; flex: none; margin-top: 1px; cursor: pointer; display: grid; place-items: center; color: #fff; padding: 0 }
.tkc.on { background: var(--tint, #2E7D5B) }
.tkc svg { width: 14px; height: 14px; stroke-width: 2.6 }
.hid { opacity: .45 }
.lbl { font-size: 12.5px; color: var(--pmuted) }
.note { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }
.fab { position: absolute; right: 16px; bottom: 86px; width: 54px; height: 54px; border: 0; border-radius: 50%; background: #5E7D12; color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.28); z-index: 20; cursor: pointer }
.fab svg { width: 26px; height: 26px; stroke-width: 2.3 }
.mainb { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; border-radius: 12px; min-height: 46px; width: 100% }
.mainb:disabled { opacity: .5; cursor: default }
.outb { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 42px; border-radius: 12px; background: none; font-weight: 600; font-size: 16px; cursor: pointer; border: 1.2px solid }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1.3px solid var(--tint, var(--c-set)); color: var(--tint, var(--c-set)); background: none; border-radius: 15px; min-height: 28px; padding: 0 11px; font-size: 13.5px; font-weight: 500; cursor: pointer }
.chip.on { background: var(--tint, var(--c-set)); color: #fff; font-weight: 600 }
.chip.dash { border-style: dashed; cursor: default }
.chip svg { width: 14px; height: 14px }
.chip.sm { min-height: 24px; font-size: 12.5px; padding: 0 9px }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 }

/* Tab bar */
.tabs { position: absolute; left: 10px; right: 10px; bottom: 12px; height: 58px; border-radius: 29px; background: var(--pglass); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: space-around; z-index: 30; padding: 0 4px; border: 1px solid var(--pline) }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9.5px; font-weight: 600; color: var(--pmuted); cursor: pointer; padding: 3px 4px; border-radius: 14px; min-width: 56px; position: relative }
.tabs button svg { width: 22px; height: 22px }
.tabs button.on { background: rgba(120,120,128,.16) }
.tabs .badge { position: absolute; right: 8px; top: -1px; background: #5E7D12; color: #fff; border-radius: 8px; font-size: 9px; padding: 0 4px; min-width: 15px; text-align: center }

/* Sheets, popups */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 50 }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; background: var(--pbg); z-index: 55; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
.sheet .scr { padding-top: 10px; padding-bottom: 30px }
.top { display: flex; align-items: center; gap: 8px; min-height: 44px }
.top .t { flex: 1; text-align: center; font-weight: 700; font-size: 17px }
.hb { border: 0; background: none; font-weight: 600; font-size: 16px; cursor: pointer; padding: 6px 4px; border-radius: 8px }
.hb.fill { color: #fff; padding: 6px 14px; border-radius: 16px }
.hb:disabled { opacity: .45; cursor: default }
.kinds { display: flex; gap: 4px; margin: 4px 0 8px }
.kinds button { flex: 1; border: 1.2px solid var(--tint); background: none; color: var(--tint); font-weight: 600; font-size: 11.5px; border-radius: 10px; min-height: 36px; padding: 0 2px; cursor: pointer; white-space: nowrap }
.kinds button.on { background: var(--tint); color: #fff }
.field { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--pline); background: var(--pcard); padding: 0 12px; font-size: 16px }
.field.ta { padding: 9px 12px; min-height: 110px; resize: none; line-height: 1.35; display: block }
.menu { position: absolute; z-index: 70; background: var(--pcard); border: 1px solid var(--pline); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.3); min-width: 220px; max-width: 330px; overflow: hidden }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 14px; font-size: 15px; cursor: pointer }
.menu button + button { border-top: 1px solid var(--pline) }
.menu button svg { width: 18px; height: 18px; color: var(--pmuted) }
.menu .mh { padding: 6px 14px 3px; font-size: 11.5px; font-weight: 700; color: var(--pmuted); text-transform: uppercase; letter-spacing: .04em; background: var(--pbg) }
.menu.tall { max-height: 430px; overflow-y: auto }
.menu .target, .box .target, .sheet .target.inset { animation: none; box-shadow: inset 0 0 0 2.5px #E6B53F; border-radius: 0 }
.dlg { position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 75; display: grid; gap: 8px }
.dlg .box { background: var(--pglass); backdrop-filter: blur(14px); border-radius: 14px; overflow: hidden; border: 1px solid var(--pline) }
.dlg .box .h { padding: 10px 14px; text-align: center; font-size: 13px; color: var(--pmuted) }
.dlg button { display: block; width: 100%; border: 0; background: none; padding: 13px 14px; font-size: 17px; cursor: pointer; color: var(--c-set); border-top: 1px solid var(--pline) }
.dlg button.cancel { background: var(--pcard); border-radius: 14px; border: 1px solid var(--pline); font-weight: 600 }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 6px 34px }
.qb { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1.1px dashed rgba(120,120,128,.55); background: none; border-radius: 9px; padding: 7px 4px; font-size: 12px; font-weight: 600; color: var(--pmuted); cursor: pointer }
.qb svg { width: 20px; height: 20px }
.qb.solid { border-style: solid }
.qb.lit { background: color-mix(in srgb, var(--c-inbox) 18%, transparent); border: 1.3px solid var(--c-inbox); color: var(--c-inbox) }
.capbar { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px }
.capbar .field { min-height: 40px; font-size: 15px }
.addb { border: 0; border-radius: 10px; background: #5E7D12; color: #fff; font-weight: 600; min-height: 40px; padding: 0 14px; font-size: 15px; cursor: pointer }
.seg { display: flex; background: rgba(120,120,128,.16); border-radius: 9px; padding: 2px; flex: 1 }
.seg button { flex: 1; border: 0; background: none; font-size: 13px; min-height: 28px; border-radius: 7px; color: var(--pink); cursor: pointer; white-space: nowrap }
.seg button.on { background: var(--pcard); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.2) }
.lrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; background: none; text-align: left; cursor: pointer }
.lrow + .lrow { border-top: 1px solid var(--pline) }
.lrow .sp, .sp { flex: 1 }
.lrow svg { width: 22px; height: 22px }
.grp { margin: 14px 4px 4px; font-size: 13px; color: var(--pmuted); font-weight: 600 }
.recent { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0; scrollbar-width: none }
.recent::-webkit-scrollbar { display: none }
.search { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--pcard); color: var(--pmuted); border-radius: 10px; padding: 0 10px; min-height: 38px; cursor: pointer; text-align: left; margin: 2px 0 4px }
.search svg { width: 18px; height: 18px }
.foot2 { position: absolute; left: 0; right: 0; bottom: 0; background: var(--pbg); border-top: 1px solid var(--pline); padding: 8px 12px 12px; z-index: 5 }
.addrow { position: absolute; left: 10px; right: 10px; bottom: 78px; background: var(--pcard); border: 1px solid var(--pline); border-radius: 14px; padding: 7px 9px; z-index: 31; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.15) }
.addrow .field { min-height: 38px; font-size: 15px }
.xb { border: 0; background: none; color: var(--pmuted); padding: 2px; cursor: pointer; display: grid }
.xb svg { width: 14px; height: 14px }
.ico { border: 0; background: none; padding: 4px; display: grid; cursor: pointer; color: var(--pmuted) }
.ico svg { width: 24px; height: 24px }
.swatch { display: inline-flex; align-items: center; gap: 4px }
.toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: #3C3550; color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 18px; z-index: 90; animation: pop .3s; max-width: 330px; text-align: center }
.topmsg { font-size: 13px; font-weight: 600; text-align: right; flex: 1; color: var(--c-inbox) }
.gold { color: var(--c-asp); font-style: italic; font-size: 13px; text-align: center; padding: 0 24px; margin-top: 10px }
.onep { position: absolute; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 26px; background: color-mix(in srgb, var(--c-today) 8%, var(--pbg)) }
.onep h2 { margin: 0 0 8px; font-size: 17px; font-weight: 700; color: var(--c-today) }
.onep .big { font-size: 31px; font-weight: 700; line-height: 1.12; margin: 8px 0 4px; overflow-wrap: anywhere }
.onep .btnw { width: 100%; display: grid; gap: 8px; margin-top: 26px }
.onep .tiny { font-size: 11.5px; color: var(--pmuted); margin-top: 16px }
.startscr { position: absolute; inset: 0; background: #2B3640; color: #fff; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; border: 0; width: 100%; padding: 24px }
.startscr .ic { width: 110px; height: 110px; border-radius: 26px; background: #6B4EA8; display: grid; place-items: center; margin-bottom: 20px }
.startscr .ic svg { width: 64px; height: 64px; stroke: #fff; stroke-width: 1.7 }
.startscr b { font-size: 34px; letter-spacing: .02em }
.startscr .d { font-size: 17px; font-weight: 600; margin-top: 12px }

    { kind: 'try', head: 'The sync ring', text: 'Tap the ring at the top right of Today, then "Sync now".', target: 'sync', setup: () => set({}), wait: 'synced', on: { 'sync-menu': 'sync-now' }, ok: 'The ring is a small clock: green when the last sync is recent, yellow after a while, red after conflicts, grey before any sync. Sync also runs by itself every few minutes.' },

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('paragontour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null) || (S.sheet ? q('sheet-cancel') : S.rem ? q('rem-back') : S.page ? q('back') : S.tab !== 'today' ? q('tab-today') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('star')}</span><div><h1>PARAGON Tour</h1><small>Learn the app in about 15 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy, nothing changes in your real app. Based on PARAGON 1.0 (336).</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); S = START();      // every step starts from a full reset, so jumping around the rail carries nothing over
  if (st.setup) st.setup();
  S.toast = ''; clearTimeout(toast.h);
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('paragontour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Open PARAGON on your iPhone and tap the start screen. Find the five tabs, and on Today the purple band with One, Note, Start and Close.',
    'Press the round + on Today, write "Call the bank tomorrow 14:00" and look for the dashed chip. Press Save.',
    'In Inbox, tap a line, press Today, then File it and choose a project. With more than six places, try Search\u2026.',
    'Open a project from Browse, add a task with "Add a task\u2026", then in Actions hold a task and choose "Waiting for\u2026".',
    'On Today press One. Try Not now once, then Done.',
    'Press Start, pick two actions and press the "Plan 2 actions" button. Look at the blocks in Plan.',
    'At the end of the week open Browse, Weekly review. Open step 3, answer a few lines, and press Review done.',
    'Open Browse, the gear: check Safety says "Everything is safe". Tap the sync ring and press Sync now, then look in Apple Reminders.',
    'Open Settings, How it works, and read the part you want to know more about.'];
  let ticks = JSON.parse(store.get('paragontour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('paragontour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet && ['new', 'one', 'close', 'who', 'fs', 'mac'].includes(S.sheet)) { S.sheet = null; renderStage(); return; }
  if (e.key === 'Escape' && S.picking) { S.picking = false; S.picks = []; renderStage(); return; }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
